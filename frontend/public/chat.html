<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LUXA Community Chat</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="chat-header-info">
        <button type="button" class="btn-nav" id="backBtn" onclick="goBack()">⬅</button>
        <img id="roomFlag" src="flags/1x1/un.svg" alt="Flag" class="header-flag" onerror="this.src='flags/1x1/un.svg'" />
        <div>
          <h1 id="room-name">Global</h1>
          <div class="chat-header-sub">
            <span id="connStatus" class="status-dot offline"></span>
            <span id="userCount">1</span> online
          </div>
        </div>
      </div>

      <div class="chat-header-actions">
        <button type="button" class="btn-toggle-sidebar" onclick="toggleSidebar()">👥</button>
        <button type="button" class="btn-close-app" onclick="closeMiniApp()">✕</button>
      </div>
    </header>

    <main class="chat-main">
      <aside class="chat-sidebar" id="chatSidebar">
        <h3>Active Miners</h3>
        <ul id="users"></ul>
      </aside>

      <div class="chat-messages" id="chatMessages"></div>
    </main>

    <footer class="chat-form-container">
      <form id="chat-form">
        <input
          id="msg"
          type="text"
          placeholder="Type message here..."
          required
          autocomplete="off"
          maxlength="400"
        />
        <button type="submit" class="btn-send">➤</button>
      </form>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.11.2/qs.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
